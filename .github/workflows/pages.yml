name: Publish store website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Build bilingual website
        run: node build.mjs
      - name: Check pages and links
        run: node scripts/check.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
